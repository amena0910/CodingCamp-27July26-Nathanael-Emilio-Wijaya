<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== THEME TOGGLE ===== -->
  <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark mode" aria-label="Toggle theme">
    <span class="theme-icon" id="theme-icon">🌙</span>
  </button>

  <!-- ===== GREETING SECTION ===== -->
  <header class="greeting-section">
    <div class="greeting-content">
      <p id="current-date" class="date-text"></p>
      <h1 id="greeting-text" class="greeting-text"></h1>
      <p id="current-time" class="time-text"></p>
      <button class="btn-edit-name" id="btn-edit-name" title="Change your name">&#9998; Edit name</button>
    </div>
  </header>

  <!-- ===== NAME PROMPT MODAL ===== -->
  <div class="modal-overlay" id="name-modal-overlay">
    <div class="modal name-modal">
      <h3 class="modal-title">Welcome to your Dashboard!</h3>
      <p class="modal-subtitle">What should we call you?</p>
      <input
        type="text"
        id="name-input"
        class="input-field"
        placeholder="Enter your name..."
        maxlength="40"
        autocomplete="off"
      />
      <div class="modal-actions">
        <button class="btn btn-primary" id="name-save">Let's go!</button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN DASHBOARD ===== -->
  <main class="dashboard">

    <!-- Focus Timer -->
    <section class="card" id="timer-card">
      <h2 class="card-title">Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="timer-start">Start</button>
        <button class="btn btn-secondary" id="timer-stop">Stop</button>
        <button class="btn btn-ghost" id="timer-reset">Reset</button>
      </div>
      <p class="timer-label" id="timer-label">Ready to focus?</p>
    </section>

    <!-- To-Do List -->
    <section class="card" id="todo-card">
      <h2 class="card-title">To-Do List</h2>

      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="input-field"
          placeholder="Add a new task..."
          maxlength="120"
        />
        <button class="btn btn-primary" id="todo-add">Add</button>
      </div>

      <ul class="todo-list" id="todo-list">
        <!-- Tasks injected by JS -->
      </ul>

      <p class="todo-empty" id="todo-empty">No tasks yet. Add one above!</p>
    </section>

    <!-- Quick Links -->
    <section class="card" id="links-card">
      <h2 class="card-title">Quick Links</h2>

      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          class="input-field"
          placeholder="Name (e.g. GitHub)"
          maxlength="30"
        />
        <input
          type="url"
          id="link-url-input"
          class="input-field"
          placeholder="URL (e.g. https://github.com)"
        />
        <button class="btn btn-primary" id="link-add">Add</button>
      </div>

      <div class="links-grid" id="links-grid">
        <!-- Links injected by JS -->
      </div>

      <p class="todo-empty" id="links-empty">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 class="modal-title">Edit Task</h3>
      <input type="text" id="modal-input" class="input-field" maxlength="120" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-save">Save</button>
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
